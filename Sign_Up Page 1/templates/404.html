<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - SIGNIFY</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================================================
   404 ERROR PAGE STYLES (Split Template Layout - Full Mechanical Robot)
   ========================================================================== */

/* Global Reset & Theme Base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}

/* ==========================================================================
   Geometric Vector Background (Curve Layout Split Screen)
   ========================================================================== */
body::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 55vw;
    height: 100%;
    background: #111111; 
    border-radius: 100% 0% 0% 100% / 50% 0% 0% 50%; 
    z-index: 1;
}

body::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 55vw;
    height: 100%;
    background: radial-gradient(circle at 70% 50%, rgba(60, 60, 60, 0.15) 0%, transparent 70%);
    border-radius: 100% 0% 0% 100% / 50% 0% 0% 50%;
    z-index: 2;
}

/* ==========================================================================
   Header Setup
   ========================================================================== */
header {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px;
    position: relative;
    z-index: 10;
}

header h1 {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #1a1a1a;
    text-transform: uppercase;
}

/* ==========================================================================
   Main Core Content Grid (Split 50/50 Layout Area)
   ========================================================================== */
main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    align-items: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 0 40px;
    position: relative;
    z-index: 5;
}

/* ==========================================================================
   Left Side Vector Layout Text Stack
   ========================================================================== */
.content-column {
    text-align: left;
    padding-right: 20px;
}

.content-column h1:first-of-type {
    font-size: 7.5rem;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    color: #111111;
    margin-bottom: 5px;
}

.content-column h1:first-of-type::after {
    content: '';
    display: block;
    width: 140px;
    height: 6px;
    background-color: #ffb703;
    margin-top: 10px;
    border-radius: 3px;
}

.content-column h1.sub-heading {
    font-size: 2rem;
    font-weight: 700;
    color: #111111;
    margin: 25px 0 10px 0;
}

.content-column p {
    font-size: 1.2rem;
    color: #666666;
    max-width: 420px;
    line-height: 1.5;
    margin-bottom: 35px;
}

.content-column p a {
    display: inline-block;
    background-color: #ffb703;
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 14px 35px;
    border-radius: 30px;
    transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(255, 183, 3, 0.4);
}

.content-column p a:hover {
    background-color: #ffc83b;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255, 183, 3, 0.6);
}

/* ==========================================================================
   Right Side Column: Complete High-Visibility Vector Character
   ========================================================================== */
.visual-column {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    position: relative;
    z-index: 5;
}

.robot-character {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    margin-left: 60px;
    animation: fullFloat 4s ease-in-out infinite;
}

/* Antenna Node Assembly */
.robot-antenna {
    width: 6px;
    height: 30px;
    background: #ffb703;
    position: relative;
    margin-bottom: -4px;
}

.robot-antenna::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    background: #ffffff;
    border: 3px solid #ffb703;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* Head Frame Chassis */
.robot-head {
    width: 180px;
    height: 130px;
    background: #ffffff;
    border: 5px solid #ffb703;
    border-radius: 40px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 25px;
    box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 3;
}

.robot-eye {
    width: 36px;
    height: 36px;
    background: #111111;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.robot-eye::after {
    content: '';
    width: 12px;
    height: 12px;
    background: #ffb703;
    border-radius: 50%;
    box-shadow: 0 0 8px #ffb703;
}

.robot-cheek {
    position: absolute;
    bottom: 25px;
    width: 16px;
    height: 8px;
    background: rgba(255, 183, 3, 0.35);
    border-radius: 50%;
}
.robot-cheek.left { left: 25px; }
.robot-cheek.right { right: 25px; }

.robot-mouth {
    position: absolute;
    bottom: 30px;
    width: 26px;
    height: 13px;
    border-bottom: 4px solid #111111;
    border-radius: 0 0 13px 13px;
}

/* Neck Structural Node */
.robot-neck {
    width: 24px;
    height: 15px;
    background: #ffb703;
    margin-top: -3px;
    margin-bottom: -3px;
    border-radius: 2px;
    z-index: 2;
}

/* Torso Plate Housing */
.robot-body {
    width: 150px;
    height: 150px;
    background: #ffffff;
    border: 5px solid #ffb703;
    border-radius: 30px;
    box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Center Dashboard Interface */
.robot-chest-screen {
    width: 90px;
    height: 65px;
    background: #111111;
    border-radius: 12px;
    border: 3px solid #e2e2e2;
    position: relative;
    overflow: hidden;
}

.robot-chest-screen::after {
    content: '';
    width: 100%;
    height: 3px;
    background: #ffb703;
    position: absolute;
    box-shadow: 0 0 6px #ffb703;
    animation: screenPulse 2s linear infinite;
}

/* Articulated Arm Extenders */
.robot-arm {
    position: absolute;
    top: 25px;
    width: 24px;
    height: 70px;
    background: #ffffff;
    border: 4px solid #ffb703;
    border-radius: 12px;
}
.robot-arm.left {
    left: -22px;
    transform-origin: top center;
    transform: rotate(20deg);
    animation: leftArmWave 4s ease-in-out infinite;
}
.robot-arm.right {
    right: -22px;
    transform-origin: top center;
    transform: rotate(-20deg);
    animation: rightArmWave 4s ease-in-out infinite;
}

.robot-hand {
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 20px;
    background: #ffb703;
    border-radius: 10px 10px 0 0;
}

/* Support Legs System */
.robot-legs-container {
    display: flex;
    justify-content: space-between;
    width: 90px;
    margin-top: -4px;
}

.robot-leg {
    width: 28px;
    height: 45px;
    background: #ffffff;
    border: 4px solid #ffb703;
    border-top: none;
    border-radius: 0 0 10px 10px;
    position: relative;
}

.robot-foot {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 14px;
    background: #ffb703;
    border-radius: 6px 6px 2px 2px;
}

/* ==========================================================================
   Animation Lifecycles
   ========================================================================== */
@keyframes fullFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

@keyframes screenPulse {
    0% { top: -5%; }
    100% { top: 105%; }
}

@keyframes leftArmWave {
    0%, 100% { transform: rotate(20deg); }
    50% { transform: rotate(35deg); }
}

@keyframes rightArmWave {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(-10deg); }
}

/* ==========================================================================
   Footer Section Formatting
   ========================================================================== */
footer {
    width: 100%;
    text-align: center;
    padding: 30px 20px;
    color: #888888;
    font-size: 0.85rem;
    line-height: 1.8;
    position: relative;
    z-index: 10;
}

footer span {
    display: inline-block;
}

/* ==========================================================================
   Responsive Structural Breakdown Adjustments
   ========================================================================== */
@media (max-width: 960px) {
    body::before, body::after {
        width: 100vw;
        height: 50vh;
        top: auto;
        bottom: 0;
        border-radius: 100% 100% 0 0 / 20% 20% 0 0;
    }
    main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        text-align: center;
        padding-bottom: 40px;
    }
    .content-column {
        text-align: center;
        padding-right: 0;
        margin-top: 20px;
    }
    .content-column h1:first-of-type::after {
        margin: 10px auto 0 auto;
    }
    .content-column p {
        margin: 20px auto 30px auto;
    }
    .visual-column {
        min-height: 380px;
    }
    .robot-character {
        margin-left: 0;
        margin-top: 30px;
    }
}

    </style>
</head>
<body>

    <!-- Main Navigation Bar Logo Block -->
    <header>
        <h1>SIGNIFY</h1>
    </header>

    <main>
        <!-- Left Side Layout Text Stack -->
        <div class="content-column">
            <h1>404</h1>
            <h1 class="sub-heading">Oops!</h1>
            <p>
                Sorry, the page you are looking for could not be found. Don't worry, you can always head safely back to where you started.
            </p>
            <p class="action-area">
                <a href="{{ url_for('landing_page') }}">Take Me Back</a>
            </p>
        </div>

        <!-- Right Side: High-Visibility Full Vector Character Arena -->
        <div class="visual-column">
            <div class="robot-character">
                <!-- Antenna Assembly -->
                <div class="robot-antenna"></div>
                
                <!-- Head Frame Component -->
                <div class="robot-head">
                    <div class="robot-cheek left"></div>
                    <div class="robot-eye"></div>
                    <div class="robot-mouth"></div>
                    <div class="robot-eye"></div>
                    <div class="robot-cheek right"></div>
                </div>
                
                <!-- Neck Link -->
                <div class="robot-neck"></div>
                
                <!-- Core Torso Section -->
                <div class="robot-body">
                    <div class="robot-arm left">
                        <div class="robot-hand"></div>
                    </div>
                    
                    <!-- Integrated Diagnostics Screen -->
                    <div class="robot-chest-screen"></div>
                    
                    <div class="robot-arm right">
                        <div class="robot-hand"></div>
                    </div>
                </div>
                
                <!-- Lower Limbs Base Assembly -->
                <div class="robot-legs-container">
                    <div class="robot-leg">
                        <div class="robot-foot"></div>
                    </div>
                    <div class="robot-leg">
                        <div class="robot-foot"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Structural Footer Area -->
    <footer>
        <span>Copyright &copy; 2026 | All Rights reserved</span>
        <br>
        <span>Privacy Policy &nbsp;</span>
        <span>Terms of Service &nbsp;</span>
        <span>Copyright &copy; Law</span>
    </footer>

</body>
</html>

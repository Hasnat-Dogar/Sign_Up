<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Page</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">

</head>

<body>
    <main>
        <form action="/signup" method="POST"
            onsubmit="if(password.value !== c_password.value){err.style.display='block';return false;}" >
            <div> <h1>Sign Up</h1> </div>
            <div> <p>Enter Your Details to Sign Up!</p> </div>
            <div>
                <label for="user_name">User_Name</label>
                <input id="user_name" name="user_name" type="text" pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9_.$\-]{5,30}"
                    placeholder="Select User_Name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" pattern=".+@gmail\.com" placeholder="Enter Your Email" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Select a Strong Password"required>
            </div>
            <div>
                <label for="c_password">Confirm Password</label>
                <input id="c_password" name="confirm_password" type="password" placeholder="Confirm Your Password" required>
                <span id="err" style="display: none; color: #ff4d4d; font-size: 14px;">
                ⚠️ Enter the Same Password!
                </span>

            </div>
            <div>
                <button type="submit">Submit</button>
            </div>
            <div>
                <label for="sign_in"> <a href="{{url_for('sign_in')}}"><h3>Already have an Account?</h3></a> </label>
            </div>
        </form>

    </main>
    <footer>
        Copyright &copy; 2026 | All Rights reserved
        <a href="{{url_for('about')}}">About_Us</a>
        <a href="{{url_for('contact')}}">Contact_Us</a>
    </footer>
</body>

</html>

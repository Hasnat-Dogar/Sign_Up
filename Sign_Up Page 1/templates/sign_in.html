<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_in</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">

</head>
<body>
    <header>
      <h1>Signify</h1>
      <div>  <a href="{{url_for('home')}}">Home</a> <a href="{{url_for('about')}}">About</a> <a href="{{url_for('contact')}}">Contact</a> <a href="/sign_in">Sign In</a> <a href="{{url_for('signup')}}">Sign Up</a> </div>
    </header>
    <main>
        <form action="/sign_in" method="POST">
            <div> <h1> Sign In </h1> </div>
            <div> <p> Enter your Details to Sign In! </p> </div>
            <div>
                <label for="user_name" >Email or User_name</label>
                <input type="text" name="login" placeholder="Enter your Username or Email" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password" required>
            </div>
            <div> <button type="submit"> Sign In </button> </div>
            <div> <label for="forgot_pass"> <a href="{{url_for('forgot_pass')}}">Forgot Password</a> </label> </div>
            <div> <label for="signup"> <a href="{{url_for('signup')}}">Create New Account?</a> </label> </div>
        </form>
    </main>
    <footer>
      <p>Subscribe to get 15% off on our Premium Plans</p>
      <span> <input type="email" pattern=".+@gmail\.com" placeholder="Enter Your Email" required> <button type="submit">Subscribe</button> </span>
      <div>
      <a href="{{url_for('about')}}">About Us</a>
      <a href="{{url_for('contact')}}">Contact Us</a>
      </div>
      <span>Copyright &copy; 2026 | All Rights reserved</span>
      <span>Privacy Poicy</span>
      <span>Terms of Service</span>
      <span>Copyright &copy; Law</span>
    </footer>
</body>
</html>

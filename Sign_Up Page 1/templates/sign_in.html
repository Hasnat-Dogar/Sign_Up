<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_in</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">

</head>
<body>
    <header>
        <div>
            <a href="{{url_for('home')}}">Home</a>
            <a href="{{url_for('signup')}}">Sign_Up</a>
        </div>
    </header>
    <main>
        <form action="/sign_in" method="POST">
            <div> <h1> Sign In </h1> </div>
            <div> <p> Enter your Details to Sign In! </p> </div>
            <div>
                <label for="user_name" >Email or User_name</label>
                <input type="text" name="login" placeholder="Enter your Username or Email" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password" required>
            </div>
            <div> <button type="submit"> Sign In </button> </div>
            <div> <label for="forgot_pass"> <a href="{{url_for('forgot_pass')}}">Forgot Password</a> </label> </div>
        </form>
    </main>
    <footer>
        Copyright &copy; 2026 | All Rights reserved
        <a href="{{url_for('about')}}">About_Us</a>
        <a href="{{url_for('contact')}}">Contact_Us</a>
    </footer>
</body>
</html>
